name: Publish NuGet Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore "Shipeng.Foundation/Shipeng.Foundation.csproj"

      - name: Build Release
        run: dotnet build "Shipeng.Foundation/Shipeng.Foundation.csproj" --configuration Release --no-restore -v:q -clp:ErrorsOnly

      - name: Pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\artifacts"
          dotnet pack "Shipeng.Foundation/Shipeng.Foundation.csproj" --configuration Release --output "${{ github.workspace }}\artifacts" -v:minimal
          Get-ChildItem "${{ github.workspace }}\artifacts" -Filter *.nupkg

      - name: NuGet login with Trusted Publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: SpoonySeedLSP

      - name: Push package to nuget.org
        shell: pwsh
        run: |
          $packages = Get-ChildItem "${{ github.workspace }}\artifacts" -Filter *.nupkg
          if (-not $packages) {
            throw "No .nupkg files found in artifacts directory."
          }

          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
