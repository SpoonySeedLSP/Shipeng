name: Publish NuGet Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Shipeng.Foundation.csproj

      - name: Build Release
        run: dotnet build Shipeng.Foundation.csproj --configuration Release --no-restore -v:q -clp:ErrorsOnly

      - name: Pack
        run: dotnet pack Shipeng.Foundation.csproj --configuration Release --no-build --output artifacts -v:q -clp:ErrorsOnly

      - name: NuGet login with Trusted Publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: SpoonySeedLSP

      - name: Push package to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
